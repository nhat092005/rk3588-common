[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rk3588-common"
version = "0.0.0"
description = "Pre/post-processing shared by PC and board for RK3588 PPE detection"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["python"]
